<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site Starter Guide</title>
<meta name="description" content="Сценарии и промпты для работы над сайтом: материалы, Figma, дизайн-система, проверка и публикация.">
<style>
:root{--ink:#202020;--muted:#636363;--line:#e9e9e7;--soft:#f7f7f5;--side:272px}
*{box-sizing:border-box}
html{scroll-padding-top:32px}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.65 "Segoe UI",Arial,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{cursor:default}
button,a,input,summary{-webkit-tap-highlight-color:transparent}
a{color:inherit;text-underline-offset:4px}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #337ab7;outline-offset:4px;border-radius:4px}
[hidden]{display:none!important}
::selection{background:#dceafd;color:#202020}
.skip{position:fixed;top:-80px;left:16px;z-index:30;padding:12px;background:#fff;border:1px solid var(--line)}
.skip:focus{top:12px}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);display:flex;flex-direction:column;padding:29px 20px 20px;border-inline-end:1px solid var(--line);background:white;z-index:10}
.brand{font-size:17px;font-weight:650;text-decoration:none;padding:0 8px;line-height:1.4}
.nav-heading{color:var(--muted);font-size:12px;margin:26px 8px 10px}
.toc{overflow-y:auto;flex:1;padding:2px 4px 12px;scrollbar-width:thin;scrollbar-color:#cfcfca transparent}
.nav-group{margin:0 0 7px}
.group-link{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 5px;cursor:pointer;font-size:14px;line-height:1.4}
.group-link::-webkit-details-marker{display:none}
.nav-chevron,.chevron{width:6px;height:6px;border-inline-end:1.3px solid #767676;border-bottom:1.3px solid #767676;transform:rotate(-45deg);flex-shrink:0}
.nav-group[open] .nav-chevron{transform:rotate(45deg)}
.topic-links{display:grid;gap:2px;padding:0 0 5px 8px}
.topic-link{padding:7px 10px;font-size:13px;line-height:1.45;text-decoration:none;color:#595959;border-radius:4px}
.topic-link:hover,.topic-link.active{background:var(--soft);color:var(--ink)}
.topic-link.active{font-weight:600}
.source-link{font-size:12px;color:var(--muted);padding:16px 8px 0;text-decoration:none}
.source-link:hover{text-decoration:underline}
.mobile-nav{display:none}
main{margin-inline-start:var(--side);padding:70px 64px 80px;max-width:1420px}
.page-header{max-width:900px;margin:0 auto 54px;text-align:center}
h1{font-size:clamp(32px,3.4vw,46px);letter-spacing:-.035em;line-height:1.2;font-weight:700;margin:0 0 30px;text-wrap:balance}
.search-box{display:flex;align-items:center;gap:16px;border:1px solid #dededb;border-radius:12px;padding:9px 16px;background:white;text-align:start}
.search-box:focus-within{outline:2px solid #337ab7;outline-offset:3px}
.search-icon{width:15px;height:15px;border:1.6px solid #6e6e6e;border-radius:50%;position:relative;flex-shrink:0;margin-inline-end:3px}
.search-icon:after{content:"";position:absolute;width:1.6px;height:6px;background:#6e6e6e;bottom:-4px;right:-3px;transform:rotate(-45deg)}
#search{padding:9px 0;width:100%;min-width:0;border:0;background:transparent;outline:none;font-size:16px;caret-color:var(--ink)}
#search::placeholder{color:var(--muted)}
#search::-webkit-search-cancel-button{display:none}
.clear{border:0;background:transparent;padding:0;display:grid;place-items:center;min-width:36px;min-height:36px;color:var(--muted);font-size:23px;border-radius:4px}
.clear:hover{background:var(--soft)}
.search-options{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:14px;text-align:start;font-size:13px;min-height:26px}
.prompt-filter{display:flex;align-items:center;gap:8px;cursor:pointer;color:#555;min-height:30px}
.prompt-filter input{width:15px;height:15px;margin:0;accent-color:#303030;cursor:pointer}
#result-count{color:var(--muted)}
#materials{max-width:900px;margin:0 auto}
.topic-group{margin-bottom:45px;scroll-margin-top:22px}
.topic-group h2{font-size:23px;line-height:1.4;letter-spacing:-.02em;font-weight:650;margin:0 0 12px}
.topic{border-bottom:1px solid var(--line);scroll-margin-top:24px}
.topic summary{list-style:none;display:flex;gap:24px;align-items:center;justify-content:space-between;padding:16px 0;cursor:pointer}
.topic summary::-webkit-details-marker{display:none}
.topic summary:hover .topic-title{text-decoration:underline;text-underline-offset:5px}
.topic-title{margin:0;font-size:16px;line-height:1.5;font-weight:400}
.chevron{transform:rotate(45deg);margin-inline-end:4px}
.topic[open] .chevron{transform:rotate(225deg)}
.topic[open] .topic-title{font-weight:400}
.topic-body{max-width:76ch;padding:0 0 25px;overflow-wrap:anywhere;font-size:15px;line-height:1.75}
.topic-body p{margin:14px 0}
.topic-body ul,.topic-body ol{margin:16px 0;padding-inline-start:23px}
.topic-body li{margin:6px 0}
.topic-body a{color:#246697}
.topic-body code:not(pre code){font:12px/1.6 Consolas,monospace;background:#f2f2f0;border-radius:3px;padding:2px 5px}
.table-scroll{overflow-x:auto;max-width:100%;margin:18px 0;scrollbar-width:thin}
.topic-body table{width:100%;min-width:420px;border-collapse:collapse;font-size:13px}
.topic-body th,.topic-body td{padding:10px 12px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
.topic-body th{font-weight:600;background:var(--soft)}
.copy-block{background:var(--soft);border-radius:8px;margin:20px 0;overflow:hidden}
.copy-bar{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e4e4df}
.copy-bar>span{font-size:12px;color:#606060}
.copy-button{font-size:12px;font-weight:550;background:white;border:1px solid #d2d2cc;border-radius:5px;padding:7px 11px;min-height:36px}
.copy-button:hover{background:#ededeb}
.copy-block pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:18px 20px}
.copy-block code{font:14px/1.8 "Segoe UI",Arial,sans-serif;color:#262626}
.command code{font-family:Consolas,monospace}
.manual-copy{padding:0 16px 16px}
.manual-copy p{font-size:13px}
.manual-copy textarea{width:100%;min-height:200px;padding:12px;font:14px/1.6 "Segoe UI",Arial,sans-serif;border:1px solid #9e9e99;border-radius:4px;background:#fff;color:var(--ink)}
.empty{max-width:900px;margin:40px auto;color:var(--muted);font-size:15px}
.empty strong{color:var(--ink);font-weight:600;display:block;margin-bottom:8px}
.empty button{display:inline-block;padding:8px 12px;background:white;border:1px solid #d2d2cc;border-radius:5px;margin-top:14px;font-size:13px}
#toast{position:fixed;bottom:22px;left:calc(50% + var(--side)/2);transform:translateX(-50%);max-width:calc(100vw - 32px);z-index:30;color:#fff;background:#272727;border-radius:6px;font-size:13px;padding:11px 17px;text-align:center}
@media(min-width:1600px){main{padding-inline:88px;max-width:1600px}}
@media(max-width:1100px){:root{--side:240px}.sidebar{padding-inline:14px}main{padding:52px 34px 65px}}
@media(max-width:780px){:root{--side:0px}html{scroll-padding-top:76px}.sidebar{position:sticky;inset:auto;top:0;width:100%;height:auto;padding:15px 20px;border-inline-end:0;border-bottom:1px solid var(--line)}.brand{padding:0;min-height:28px;display:flex;align-items:center;font-size:15px}.mobile-nav{position:absolute;right:20px;top:11px;display:block;min-height:36px;padding:6px 10px;font-size:13px;border:1px solid #d2d2cc;border-radius:5px;background:white}.nav-heading,.source-link{display:none}.toc{display:none;max-height:65dvh;padding-top:18px}.sidebar.expanded .toc{display:block}.sidebar.expanded .source-link{display:block;padding-top:8px}.group-link{padding-block:11px}.topic-link{font-size:14px;padding-block:8px}main{padding:33px 22px 50px}.page-header{margin-bottom:35px;text-align:start}h1{font-size:32px;margin-bottom:23px;max-width:340px;letter-spacing:-.025em}.search-box{padding:8px 12px;gap:12px;border-radius:9px}#search{font-size:15px;padding-block:9px}.search-options{font-size:12px;margin-top:12px}.topic-group{margin-bottom:32px;scroll-margin-top:10px}.topic-group h2{font-size:21px;margin-bottom:9px}.topic{scroll-margin-top:10px}.topic summary{padding:15px 0;gap:16px}.topic-title{font-size:15px}.topic-body{font-size:14px}.copy-bar{padding:10px 12px}.copy-button{min-height:40px;font-size:11px;padding-inline:9px}.copy-block pre{padding:15px}.copy-block code{font-size:13px}#toast{left:50%;bottom:16px}}
@media print{.sidebar,.page-header,.copy-button,#toast{display:none!important}main{margin:0;padding:0;max-width:none}details,details>*{display:block!important}.topic{break-inside:avoid}.topic[hidden],.topic-group[hidden]{display:block!important}}

/* Measured from notion.com/help at desktop and mobile widths. */
:root{--ink:rgba(0,0,0,.9);--muted:#646464;--line:rgba(0,0,0,.08);--soft:#f6f5f4;--side:280px}
body{font-family:NotionInter,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:24px;color:var(--ink)}
.masthead{height:64px;position:sticky;top:0;z-index:20;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:24px}
.masthead .brand{padding:0;font-size:20px;font-weight:700;letter-spacing:-.25px}
.top-links{display:flex;align-items:center;gap:24px;font-size:14px;line-height:20px}
.top-links a{text-decoration:none}.top-links a:hover{text-decoration:underline}
.top-links .primary-link{background:#0075de;color:white;padding:8px 14px;border-radius:8px;font-size:16px;line-height:24px;font-weight:500}
.sidebar{top:64px;padding:20px 16px;border-color:var(--line)}
.sidebar>.brand{display:none}.nav-heading{font-size:12px;line-height:16px;margin:0 8px 8px;color:#787774}
.nav-group{margin:0;padding:6px 0;border-bottom:1px solid #e9e9e7}.group-link{font-size:16px;font-weight:400;line-height:20px;padding:6px 8px;min-height:32px;border-radius:4px}
.group-link:hover{background:var(--soft)}.nav-chevron{width:5px;height:5px;border-color:#878787}
.topic-links{padding:4px 0 8px 8px}.topic-link{font-size:14px;line-height:20px;padding:6px 8px}
.toc{padding:0;overflow-y:auto}.source-link{padding:24px 8px 0;font-size:14px;line-height:20px}
main{margin-left:280px;padding:48px 24px;max-width:none}
.page-header,#materials,.category-section,.empty{width:100%;max-width:804px;margin-left:auto;margin-right:auto}
.page-header{margin-bottom:40px;text-align:center}
h1{font-size:54px;line-height:56px;letter-spacing:-1.875px;font-weight:700;margin:0 2px 24px;text-wrap:initial}
.search-box{height:56px;border:1px solid var(--line);border-radius:200px;padding:0 16px 0 24px;gap:16px;margin:0 2px}
#search{font-size:16px;padding:0;line-height:24px}#search::placeholder{color:#646464}
.search-icon{width:16px;height:16px;border-color:#787774}.search-icon:after{background:#787774}
.search-options{justify-content:center;gap:8px;margin-top:24px;min-height:36px;flex-wrap:wrap}
.quick-link,.prompt-filter{background:#f9f9f8;border-radius:4px;padding:4px 16px;font-size:14px;line-height:20px;color:var(--ink);text-decoration:none;min-height:28px}
.quick-link:hover,.prompt-filter:hover{background:#efefed}.prompt-filter input{width:14px;height:14px}
#result-count{font-size:14px;line-height:20px;flex-basis:100%}
.category-section{margin-bottom:56px}.category-section h2,.topic-group h2{font-size:32px;line-height:40px;letter-spacing:-.75px;font-weight:700;margin:0 0 24px}
.category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 24px}
.category-card{display:flex;flex-direction:column;min-height:206px;background:var(--soft);border-radius:16px;padding:24px;text-decoration:none;color:var(--ink)}
.category-card:hover{background:#eeedeb}.category-card h3{font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.125px;margin:0 0 4px}
.category-card p{font-size:14px;line-height:20px;font-weight:400;margin:0}
.category-art{display:block;align-self:flex-end;margin-top:auto;padding-top:16px;color:#343432}.category-art svg{width:48px;height:48px;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.topic-group{margin-bottom:48px}.topic-title{font-size:16px;font-weight:400;line-height:24px}.topic summary{padding:16px 0}
.topic-title:has(.prompt-number){display:grid;grid-template-columns:100px minmax(0,1fr);gap:16px;align-items:baseline;width:100%}
.prompt-number{color:#666;font-size:13px;line-height:20px;font-weight:400}
.prompt-name{font-weight:400}
.topic-link .prompt-number{display:block;font-size:12px;line-height:18px;margin-bottom:2px}
.topic-link .prompt-name{font-weight:500}
.topic-body{font-size:16px;line-height:26px;max-width:100%}.topic-body p{margin:16px 0}
.copy-block code,.manual-copy textarea{font-family:NotionInter,Inter,"Segoe UI",Arial,sans-serif}
.mobile-nav{position:static;display:none;border:0;border-radius:4px;background:white;font-size:0;padding:8px;min-width:36px;min-height:36px}.mobile-nav:before{content:"";display:block;width:20px;height:14px;border-top:1.5px solid currentColor;border-bottom:1.5px solid currentColor;background:linear-gradient(currentColor,currentColor) center/20px 1.5px no-repeat}
@media(min-width:1600px){main{padding:48px 24px;max-width:none}}
@media(max-width:1100px){:root{--side:280px}.sidebar{padding:20px 16px}main{padding:48px 24px}}

<main id="main" tabindex="-1">
<header class="page-header">
<h1>Гайд и промпты для сайта</h1>
<div role="search">
<label class="search-box" for="search"><span class="search-icon" aria-hidden="true"></span><input id="search" type="search" placeholder="Поиск по гайду" aria-label="Поиск по всему гайду" autocomplete="off" disabled><button type="button" class="clear" aria-label="Очистить поиск" hidden>×</button></label>
<div class="search-options"><a class="quick-link" href="#group-context">Бэкап</a><a class="quick-link" href="#group-system">Дизайн-система</a><a class="quick-link" href="#topic-be60156a2c">Ревью</a><label class="prompt-filter"><input id="prompt-only" type="checkbox" disabled>Только промпты</label><span id="result-count" role="status" hidden></span></div>

<noscript><p>Для поиска и копирования включи JavaScript. Все материалы доступны ниже; промпты можно выделить и скопировать вручную.</p><style>@media(max-width:780px){.toc{display:block;max-height:140px}}</style></noscript>

<script id="search-data" type="application/json">@@DATA@@</script>
<script>
(()=>{'use strict';
const search=document.querySelector('#search'),cards=[...document.querySelectorAll('.topic')],groups=[...document.querySelectorAll('.topic-group')],navLinks=[...document.querySelectorAll('.topic-link')],clear=document.querySelector('.clear'),count=document.querySelector('#result-count'),empty=document.querySelector('#empty'),sidebar=document.querySelector('.sidebar'),mobile=document.querySelector('.mobile-nav'),promptOnly=document.querySelector('#prompt-only');
const data=JSON.parse(document.querySelector('#search-data').textContent);
const normalize=s=>s.toLowerCase().replaceAll('ё','е').replace(/[–—-]/g,' ');
const searchable=new Map(Object.entries(data).map(([id,text])=>[id,normalize(text)]));let toastTimer;
search.disabled=false;promptOnly.disabled=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);
document.querySelectorAll('table').forEach(table=>{const wrap=document.createElement('div');wrap.className='table-scroll';wrap.tabIndex=0;wrap.setAttribute('role','region');wrap.setAttribute('aria-label','Таблица, при необходимости прокручивается горизонтально');table.before(wrap);wrap.append(table)});
function apply(){const terms=normalize(search.value.trim()).split(/\s+/).filter(Boolean);let n=0;const scores=new Map();for(const card of cards){const title=normalize(card.querySelector('.topic-title').textContent),hit=(!promptOnly.checked||card.dataset.prompt==='true')&&terms.every(t=>searchable.get(card.id).includes(t)),titleHit=terms.length&&terms.every(t=>title.includes(t));card.hidden=!hit;if(hit)n++;scores.set(card.id,hit?(titleHit?100:0)+terms.filter(t=>title.includes(t)).length*10+(card.dataset.prompt==='true'?2:0):-1);if(terms.length)card.open=false;}const groupScores=new Map();for(const group of groups){const own=cards.filter(c=>c.dataset.group===group.id.replace('group-','')),visible=own.filter(c=>!c.hidden);group.hidden=!visible.length;groupScores.set(group.id,Math.max(-1,...visible.map(c=>scores.get(c.id))));const ordered=terms.length?[...own].sort((a,b)=>scores.get(b.id)-scores.get(a.id)):own;ordered.forEach(c=>group.append(c));}const orderedGroups=terms.length?[...groups].sort((a,b)=>groupScores.get(b.id)-groupScores.get(a.id)):groups;orderedGroups.forEach(g=>document.querySelector('#materials').append(g));empty.hidden=n!==0;clear.hidden=!search.value;count.hidden=!terms.length&&!promptOnly.checked;count.textContent=`Найдено: ${n}`;document.querySelector("#categories").hidden=Boolean(terms.length||promptOnly.checked);}
function reset(){search.value='';promptOnly.checked=false;apply();}
search.addEventListener('input',apply);clear.addEventListener('click',()=>{search.value='';apply();search.focus()});promptOnly.addEventListener('change',apply);document.querySelector('#reset').addEventListener('click',()=>{reset();search.focus()});
function closeNav(){sidebar.classList.remove('expanded');mobile.setAttribute('aria-expanded','false')}
mobile.addEventListener('click',()=>{const expanded=sidebar.classList.toggle('expanded');mobile.setAttribute('aria-expanded',String(expanded))});
function mark(id){navLinks.forEach(a=>{const on=a.hash==='#'+id;a.classList.toggle('active',on);if(on)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current')})}
function reveal(hash,scroll=true){let id;try{id=decodeURIComponent(hash.replace(/^#/,''))}catch{return}const target=document.getElementById(id);if(!target)return;if(target.hidden||target.closest('.topic-group')?.hidden)reset();if(target.matches('.topic')){target.open=true;mark(target.id)}closeNav();if(scroll)requestAnimationFrame(()=>{target.scrollIntoView({block:'start'});const focusTarget=target.id==='main'?target:target.matches('.topic')?target.querySelector('summary'):null;focusTarget?.focus({preventScroll:true})});}
document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',event=>{event.preventDefault();const hash=a.getAttribute('href');try{history.pushState(null,'',hash)}catch{location.hash=hash}reveal(hash)}));window.addEventListener('hashchange',()=>reveal(location.hash));window.addEventListener('popstate',()=>reveal(location.hash));if(location.hash)reveal(location.hash);
const observer=new IntersectionObserver(entries=>{const first=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(first)mark(first.target.id)},{rootMargin:'-15% 0px -60% 0px'});cards.forEach(c=>observer.observe(c));
function toast(text){const box=document.querySelector('#toast');clearTimeout(toastTimer);box.textContent=text;box.hidden=false;toastTimer=setTimeout(()=>box.hidden=true,4000)}
async function copy(text){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);return true}catch{}}const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.cssText='position:fixed;top:0;left:-10000px;';document.body.append(area);area.select();let ok=false;try{ok=document.execCommand('copy')}catch{}area.remove();return ok;}
document.querySelectorAll('.copy-button').forEach(button=>button.addEventListener('click',async()=>{const block=button.closest('.copy-block'),text=block.querySelector('code').textContent,previous=button.textContent;button.disabled=true;const ok=await copy(text);button.disabled=false;if(ok){button.textContent='Скопировано';toast('Промпт скопирован');setTimeout(()=>button.textContent=previous,2200);button.focus();}else{let fallback=block.querySelector('.manual-copy');if(!fallback){fallback=document.createElement('div');fallback.className='manual-copy';const p=document.createElement('p');p.textContent='Браузер ограничил копирование. Выдели текст ниже и нажми Ctrl+C (на Mac — ⌘C).';const area=document.createElement('textarea');area.readOnly=true;area.value=text;area.setAttribute('aria-label','Промпт для ручного копирования');fallback.append(p,area);block.append(fallback)}fallback.querySelector('textarea').focus();fallback.querySelector('textarea').select();toast('Доступно ручное копирование')}}));
document.addEventListener('keydown',event=>{const editing=event.target.matches('input,textarea,[contenteditable="true"]');if(event.key==='/'&&!editing&&!event.ctrlKey&&!event.metaKey&&!event.altKey){event.preventDefault();search.focus();search.scrollIntoView({block:'center'})}if(event.key==='Escape'){closeNav();if(event.target===search){search.value='';apply()}}});
})();
</script>
